<VirtualHost *:80>
  ServerName tickex.com.ar
  ServerAlias www.tickex.com.ar
  RewriteEngine On
  RewriteRule ^/\.well-known/acme-challenge/ - [L]
  RewriteRule ^/(.*)$ https://www.tickex.com.ar/$1 [R=301,L,NE]

  Alias /.well-known/acme-challenge/ "/var/www/letsencrypt/.well-known/acme-challenge/"
  <Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
    AllowOverride None
    Options None
    Require all granted
  </Directory>

  ErrorLog /opt/ferozo/logs/tickex_error.log
</VirtualHost>

<VirtualHost *:443>
  ServerName tickex.com.ar
  ServerAlias www.tickex.com.ar
  DocumentRoot /opt/ferozo3/web/str
  DirectoryIndex conocer_tickex.php
  RewriteEngine On
  RewriteRule ^/\.well-known/acme-challenge/ - [L]
  RewriteCond %{HTTP_HOST} ^tickex\.com\.ar$ [NC]
  RewriteRule ^/(.*)$ https://www.tickex.com.ar/$1 [R=301,L,NE]
  RewriteCond %{THE_REQUEST} "\\s/+login\\.php(?:[?\\s])" [NC]
  RewriteRule ^/login\.php$ /ingresar [R=302,L,NE]
  RewriteCond %{THE_REQUEST} "\\s/+panel_usuario\\.php(?:[?\\s])" [NC]
  RewriteRule ^/panel_usuario\.php$ /mi-cuenta [R=302,L,NE]
  RewriteCond %{THE_REQUEST} "\\s/+panel_usuario_mi_perfil\\.php(?:[?\\s])" [NC]
  RewriteRule ^/panel_usuario_mi_perfil\.php$ /mi-cuenta/perfil [R=302,L,NE]
  RewriteCond %{THE_REQUEST} "\\s/+panel_admin\\.php(?:[?\\s])" [NC]
  RewriteRule ^/panel_admin\.php$ /administrar [R=302,L,NE]
  RewriteRule ^/(?:tests|migrations|tools|patchs)(?:/|$) - [R=404,L,NC]
  RewriteRule ^/(?:diag_|debug_|apply_mapping_|import_|tmp_|crear_tabla_|crear_clientes_site_demo|check_setup\.php$|usuarios\.php$) - [R=404,L,NC]
  RewriteRule ^/notification/tcwbh/?$ /totalcoin_webhook.php [END]
  RewriteRule ^/ingresar/?$ /login.php [END]
  RewriteRule ^/mi-cuenta/?$ /panel_usuario.php [END]
  RewriteRule ^/mi-cuenta/perfil/?$ /panel_usuario_mi_perfil.php [END]
  RewriteRule ^/salir/?$ /logout_usuario.php [END]
  RewriteRule ^/administrar/?$ /panel_admin.php [END]
  RewriteRule ^/entrada/([A-Fa-f0-9]{40,128})/?$ /ticket.php?t=$1 [END,NE]
  RewriteRule ^/validar/([A-Fa-f0-9]{40,128})/?$ /checkin.php?t=$1 [END,NE]
  IncludeOptional /opt/ferozo3/web/.secrets/totalcoin_webhook_env.conf

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/tickex.com.ar/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/tickex.com.ar/privkey.pem

  <Directory "/opt/ferozo3/web/str">
    AllowOverride None
    Options FollowSymLinks
    Require all granted
    <FilesMatch "(?i)(^arca_config\.json$|\.(?:sqlite|sqlite3|db|sql|log|env|ini|bak|save|pem|key|crt|p12|pfx|tar|gz|zip)$)">
      Require all denied
    </FilesMatch>
  </Directory>

  <Directory "/opt/ferozo3/web">
    AllowOverride None
  </Directory>

  Alias /.well-known/acme-challenge/ "/var/www/letsencrypt/.well-known/acme-challenge/"
  <Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
    AllowOverride None
    Options None
    Require all granted
  </Directory>

  ErrorLog /opt/ferozo/logs/tickex_ssl_error.log
  LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" tickex_ssl_fmt
  CustomLog /opt/ferozo/logs/tickex_ssl_access.log tickex_ssl_fmt
  ProxyFCGISetEnvIf "true" PHP_ADMIN_VALUE "log_errors=On\nerror_log=/opt/ferozo3/web/.secrets/str_php_fatal.log\nerror_reporting=E_ALL\ndisplay_errors=Off"
</VirtualHost>
