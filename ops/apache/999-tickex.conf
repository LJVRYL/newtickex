<VirtualHost *:80>
  ServerName tickex.com.ar
  ServerAlias www.tickex.com.ar
  RewriteEngine On
  RewriteRule ^/\.well-known/acme-challenge/ - [L]
  RewriteRule ^/(.*)$ https://www.tickex.com.ar/$1 [R=301,L,NE]

  Alias /.well-known/acme-challenge/ "/var/www/letsencrypt/.well-known/acme-challenge/"
  <Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
    AllowOverride None
    Options None
    Require all granted
  </Directory>

  ErrorLog /opt/ferozo/logs/tickex_error.log
</VirtualHost>

<VirtualHost *:443>
  ServerName tickex.com.ar
  ServerAlias www.tickex.com.ar
  DocumentRoot /opt/ferozo3/web/str
  DirectoryIndex conocer_tickex.php
  RewriteEngine On
  RewriteRule ^/\.well-known/acme-challenge/ - [L]
  RewriteRule ^/(?:conocer_tickex\.php|tickex-logo_sobre_oscuro\.svg|tickex-isotipo\.svg)$ - [L,NC]
  RewriteRule ^/(.+)$ https://str.tickex.com.ar/$1 [R=302,L,NE]

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/tickex.com.ar/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/tickex.com.ar/privkey.pem

  <Directory "/opt/ferozo3/web/str">
    AllowOverride None
    Options FollowSymLinks
    Require all granted
    <FilesMatch "(?i)(^arca_config\.json$|\.(?:sqlite|sqlite3|db|sql|log|env|ini|bak|save|pem|key|crt|p12|pfx|tar|gz|zip)$)">
      Require all denied
    </FilesMatch>
  </Directory>

  Alias /.well-known/acme-challenge/ "/var/www/letsencrypt/.well-known/acme-challenge/"
  <Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
    AllowOverride None
    Options None
    Require all granted
  </Directory>

  ErrorLog /opt/ferozo/logs/tickex_ssl_error.log
  ProxyFCGISetEnvIf "true" PHP_ADMIN_VALUE "log_errors=On\nerror_log=/opt/ferozo3/web/.secrets/str_php_fatal.log\nerror_reporting=E_ALL\ndisplay_errors=Off"
</VirtualHost>
