<!-- ko with: tasksVM -->

<a class="dropdown-toggle" data-toggle="dropdown">
    <!-- ko if: count() <= 0 -->
        <i class="icon icon-tasks fadeInDown" rel="tooltip" title="<?php echo $this->get('translator')->trans('Tareas',array(),'templates'); ?>"></i>
    <!-- /ko -->
    <!-- ko if: count() > 0 -->
            <span class="pull-left visible-desktop">
            <svg width="35" height="25" viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" version="1.1" stroke="#FBB450">
                        <g fill="none" fill-rule="evenodd">
                            <g transform="translate(1 1)" stroke-width="2">
                                <circle stroke-opacity=".5" cx="18" cy="18" r="18"/>
                                <text x="14" y="22" font-family="times" font-size="15" data-bind="text: count">

                                </text>
                                <path d="M36 18c0-9.94-8.06-18-18-18">
                                    <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="1s" repeatCount="indefinite"/>
                                </path>
                            </g>
                        </g>
                    </svg>
            </span>    
    <!-- /ko -->
    <!-- <?php echo ucfirst($this->get('translator')->trans('Tareas',array(),'templates')); ?> -->
    <b class="caret"></b>
</a>

<ul class="dropdown-menu dropdown-task menu-cmd-tasks ">
    <!-- ko if: data() != '' -->
        <!-- ko foreach: data() -->
            <li>
                <div data-bind="attr: { class: 'status'+status()}">
                    <!--
                        0   > No iniciado
                        10  > En ejecucion
                        100 > En espera
                        200 > Terminado
                        300 > Error temporal
                        400 > Validation error
                        500 > Error
                    -->
                    <date class="command-date" data-bind="text: $root.formatDate(scheduledTime())"></date>
                    <span class="command-template">
                        <!-- ko if: status() == 0 -->
                            <i class="icon-time"> </i>
                        <!-- /ko -->
                        <!-- ko if: status() == 200 -->
                            <i class="icon-ok-sign"> </i>
                        <!-- /ko -->
                        <!-- ko if: status() == 10 || status() == 800 -->
                            <i class="icon-cogs"> </i>
                        <!-- /ko -->
                        <!-- ko if: status() == 300 ||  status() == 400 ||  status() == 500 -->
                            <i class="icon-remove-sign"> </i>
                        <!-- /ko -->
                        <span data-bind="text: commandTemplate.name"></span>
                    </span>
                    <span class="command-value" data-bind="text: displayValue() ? displayValue() : ''"></span>
                    <!-- ko if: status() == 0 || status() == 10 ||  status() == 100 ||  status() == 300 ||  status() == 800 -->
                        <div class="progress task-progress progress-striped progress-warning active">
                            <div class="bar" data-bind="style: { width: status() == 0 ? '1%' : '97%' }"></div>
                        </div>
                    <!-- /ko -->
                </div>
            </li>
        <!-- /ko -->
    <!-- /ko -->
    <!-- ko if: data() == '' -->
        <li class="mb10 mt10">
            <span><?php echo $this->get('translator')->trans('No se han encontrado tareas',array(),'templates'); ?></span>
        </li>
    <!-- /ko -->
</ul>
<!-- /ko -->
